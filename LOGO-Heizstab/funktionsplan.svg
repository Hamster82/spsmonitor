<text x="528" y="200" font-size="9.5" text-anchor="start" fill="#7a8795" font-weight="normal">genug / Import / Auto</text>
<rect x="556" y="440" width="584" height="150" rx="6" fill="#f2f7fc" stroke="#2f6fb0" stroke-width="1.5"/>
<text x="848" y="462" font-size="12.5" text-anchor="middle" fill="#17202b" font-weight="bold">Anbindung SPS-Monitor-App  (LOGO! als S7-Server · VM = DB1)</text>
<text x="574" y="486" font-size="11.5" text-anchor="start" fill="#2a3744" font-weight="bold">App schreibt:</text>
<text x="574" y="504" font-size="11" text-anchor="start" fill="#17202b" font-weight="normal" font-family="DejaVu Sans Mono">DB1.DBX0.0 M1 Automatik   ·   DB1.DBX0.1 M2 Hand</text>
<text x="574" y="520" font-size="11" text-anchor="start" fill="#17202b" font-weight="normal" font-family="DejaVu Sans Mono">DB1.DBX0.2…0.4  M3/M4/M5 Hand-Stufen</text>
<text x="574" y="540" font-size="11.5" text-anchor="start" fill="#2a3744" font-weight="bold">App liest:</text>
<text x="574" y="558" font-size="11" text-anchor="start" fill="#17202b" font-weight="normal" font-family="DejaVu Sans Mono">DB1.DBX1.0…1.2 Q1/Q2/Q3   ·   DB1.DBX1.3 Auto  ·  1.4 Hand</text>
<text x="574" y="574" font-size="11" text-anchor="start" fill="#17202b" font-weight="normal" font-family="DejaVu Sans Mono">DB1.DBW2 Überschuss(W)  ·  DBW4 Ein-Schwelle  ·  DBW6 Aus-Schwelle</text>
<rect x="24" y="440" width="500" height="150" rx="6" fill="#fafbfc" stroke="#c9d2dc" stroke-width="1.5"/>
<text x="34" y="462" font-size="12.5" text-anchor="start" fill="#17202b" font-weight="bold">So wirkt die Logik (kurz)</text>
<text x="34" y="482" font-size="11" text-anchor="start" fill="#2a3744" font-weight="normal">• „Überschuss“ = Einspeisung ins Netz (nach Hausverbrauch und Batterie).</text>
<text x="34" y="500" font-size="11" text-anchor="start" fill="#2a3744" font-weight="normal">• Steigt der Überschuss über 1200 W, schaltet nach 60 s die nächste Stufe zu —</text>
<text x="34" y="518" font-size="11" text-anchor="start" fill="#2a3744" font-weight="normal">   eine nach der anderen, weil jede Stufe den Überschuss um ~1 kW senkt.</text>
<text x="34" y="536" font-size="11" text-anchor="start" fill="#2a3744" font-weight="normal">• Wird Strom aus dem Netz bezogen (≤ −300 W, 30 s), schalten die Stufen ab.</text>
<text x="34" y="554" font-size="11" text-anchor="start" fill="#2a3744" font-weight="normal">• Alle Schwellen/Zeiten sind einstellbar; die App kann sie ändern.</text>
<text x="34" y="572" font-size="11" text-anchor="start" fill="#2a3744" font-weight="normal">• Hand-Modus (M2): Stufen folgen direkt M3/M4/M5, unabhängig vom Überschuss.</text>
<text x="24" y="744" font-size="10.5" text-anchor="start" fill="#7a8795" font-weight="normal">Hinweis: Blocknamen entsprechen LOGO!Soft-Comfort-Blöcken. Die genaue Verdrahtung steht in der Block-Tabelle des Begleitdokuments.</text>
</svg>