<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" font-family="DejaVu Sans, Arial, sans-serif">
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 z" fill="#5a6673"/></marker></defs>
<rect x="0" y="0" width="1180" height="760" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="24" y="30" font-size="17" text-anchor="start" fill="#17202b" font-weight="bold">PV-Überschuss-Heizstab – Funktionsplan (LOGO! 8.3)</text>
<text x="24" y="50" font-size="11.5" text-anchor="start" fill="#5a6673" font-weight="normal">3 Stufen à 1 kW, einzeln geschaltet · Betrieb nur bei Netz-Einspeisung · bedien- und beobachtbar über die SPS-Monitor-App (S7 / VM = DB1)</text>
<rect x="24" y="80" width="210" height="70" rx="6" fill="#fff7e8" stroke="#d9a441" stroke-width="1.5"/>
<text x="129.0" y="98" font-size="12.5" text-anchor="middle" fill="#17202b" font-weight="bold">Kostal: Überschuss (W)</text>
<text x="129.0" y="114" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">vorhandene Schnittstelle</text>
<text x="129.0" y="128" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">im Programm (Analogwert)</text>
<rect x="24" y="168" width="210" height="58" rx="6" fill="#eef4fb" stroke="#2f6fb0" stroke-width="1.5"/>
<text x="129.0" y="186" font-size="12.5" text-anchor="middle" fill="#17202b" font-weight="bold">I1  Freigabe Automatik</text>
<text x="129.0" y="202" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">Schalter am Schrank</text>
<text x="129.0" y="216" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">(Automatik ohne App)</text>
<rect x="24" y="244" width="210" height="96" rx="6" fill="#ecf6ee" stroke="#3b8f54" stroke-width="1.5"/>
<text x="129.0" y="262" font-size="12.5" text-anchor="middle" fill="#17202b" font-weight="bold">App-Merker (VM)</text>
<text x="129.0" y="278" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">M1  Automatik-Freigabe</text>
<text x="129.0" y="292" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">M2  Hand-Modus</text>
<text x="129.0" y="306" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">M3/M4/M5  Hand Stufe 1/2/3</text>
<rect x="280" y="80" width="210" height="72" rx="6" fill="#fff7e8" stroke="#d9a441" stroke-width="1.5"/>
<text x="385.0" y="98" font-size="12.5" text-anchor="middle" fill="#17202b" font-weight="bold">Analogverstärker</text>
<text x="385.0" y="114" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">Vorzeichen / Skalierung</text>
<text x="385.0" y="128" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">→ AM1 (Überschuss, W)</text>
<rect x="280" y="172" width="210" height="60" rx="6" fill="#eef4fb" stroke="#2f6fb0" stroke-width="1.5"/>
<text x="385.0" y="190" font-size="12.5" text-anchor="middle" fill="#17202b" font-weight="bold">Schwellwertschalter</text>
<text x="385.0" y="206" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">ab +1200 W  →  „genug“</text>
<rect x="280" y="250" width="210" height="74" rx="6" fill="#eef4fb" stroke="#2f6fb0" stroke-width="1.5"/>
<text x="385.0" y="268" font-size="12.5" text-anchor="middle" fill="#17202b" font-weight="bold">Schwellwertschalter + NOT</text>
<text x="385.0" y="284" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">unter −300 W = Import</text>
<text x="385.0" y="298" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">30 s bestätigt →  „Import“</text>
<rect x="280" y="344" width="210" height="70" rx="6" fill="#ecf6ee" stroke="#3b8f54" stroke-width="1.5"/>
<text x="385.0" y="362" font-size="12.5" text-anchor="middle" fill="#17202b" font-weight="bold">Betriebsart (Verknüpfung)</text>
<text x="385.0" y="378" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">Auto = (M1 ∨ I1) ∧ ¬M2</text>
<text x="385.0" y="392" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">Hand = M2</text>
<text x="681.0" y="74" font-size="12.5" text-anchor="middle" fill="#17202b" font-weight="bold">Stufen-Sequenzer  (Reihenfolge 1 → 2 → 3)</text>
<rect x="556" y="92" width="250" height="86" rx="6" fill="#f3f0fb" stroke="#7a5bb0" stroke-width="1.5"/>
<text x="681.0" y="110" font-size="12.5" text-anchor="middle" fill="#17202b" font-weight="bold">Stufe 1</text>
<text x="681.0" y="126" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">Setzen: Auto ∧ — ∧ genug</text>
<text x="681.0" y="140" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">     → Einschaltverz. 60 s → S1</text>
<text x="681.0" y="154" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">Rücksetzen: Import ∨ ¬Auto</text>
<text x="681.0" y="168" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">RS-Selbsthalterelais  →  S1</text>
<rect x="556" y="196" width="250" height="86" rx="6" fill="#f3f0fb" stroke="#7a5bb0" stroke-width="1.5"/>
<text x="681.0" y="214" font-size="12.5" text-anchor="middle" fill="#17202b" font-weight="bold">Stufe 2</text>
<text x="681.0" y="230" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">Setzen: Auto ∧ S1 ∧ genug</text>
<text x="681.0" y="244" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">     → Einschaltverz. 60 s → S2</text>
<text x="681.0" y="258" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">Rücksetzen: Import ∨ ¬Auto ∨ ¬S1</text>
<text x="681.0" y="272" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">RS-Selbsthalterelais  →  S2</text>
<rect x="556" y="300" width="250" height="86" rx="6" fill="#f3f0fb" stroke="#7a5bb0" stroke-width="1.5"/>
<text x="681.0" y="318" font-size="12.5" text-anchor="middle" fill="#17202b" font-weight="bold">Stufe 3</text>
<text x="681.0" y="334" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">Setzen: Auto ∧ S2 ∧ genug</text>
<text x="681.0" y="348" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">     → Einschaltverz. 60 s → S3</text>
<text x="681.0" y="362" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">Rücksetzen: Import ∨ ¬Auto ∨ ¬S2</text>
<text x="681.0" y="376" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">RS-Selbsthalterelais  →  S3</text>
<line x1="798" y1="178" x2="798" y2="196" stroke="#7a5bb0" stroke-width="1.4"/>
<line x1="798" y1="282" x2="798" y2="300" stroke="#7a5bb0" stroke-width="1.4"/>
<text x="990" y="74" font-size="12.5" text-anchor="middle" fill="#17202b" font-weight="bold">Ausgänge (Relais)</text>
<rect x="840" y="100" width="300" height="66" rx="6" fill="#fde9e7" stroke="#c0453c" stroke-width="1.5"/>
<text x="990.0" y="118" font-size="12.5" text-anchor="middle" fill="#17202b" font-weight="bold">Q1  →  Schütz Stufe 1 (1 kW)</text>
<text x="990.0" y="134" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">Q1 = (Auto ∧ S1)  ∨  (Hand ∧ M3)</text>
<rect x="840" y="196" width="300" height="66" rx="6" fill="#fde9e7" stroke="#c0453c" stroke-width="1.5"/>
<text x="990.0" y="214" font-size="12.5" text-anchor="middle" fill="#17202b" font-weight="bold">Q2  →  Schütz Stufe 2 (1 kW)</text>
<text x="990.0" y="230" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">Q2 = (Auto ∧ S2)  ∨  (Hand ∧ M4)</text>
<rect x="840" y="292" width="300" height="66" rx="6" fill="#fde9e7" stroke="#c0453c" stroke-width="1.5"/>
<text x="990.0" y="310" font-size="12.5" text-anchor="middle" fill="#17202b" font-weight="bold">Q3  →  Schütz Stufe 3 (1 kW)</text>
<text x="990.0" y="326" font-size="11" text-anchor="middle" fill="#2a3744" font-weight="normal">Q3 = (Auto ∧ S3)  ∨  (Hand ∧ M5)</text>
