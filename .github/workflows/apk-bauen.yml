# Baut die APK bei GitHub – auf dem eigenen Rechner wird dafür weder
# Android Studio noch ein SDK gebraucht.
#
# Nach dem Hochladen: Reiter "Actions" -> "APK bauen" -> "Run workflow".
# Die fertige APK liegt danach unter "Artifacts" und zusätzlich im Branch "apk".

name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android-SDK-Lizenzen bestätigen
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: APK bauen
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk SpsMonitor.apk

      - name: APK zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v5
        with:
          name: SpsMonitor-APK
          path: SpsMonitor.apk

      - name: APK im Branch "apk" ablegen
        run: |
          mkdir apk-out && cp SpsMonitor.apk apk-out/
          cd apk-out
          git init -q && git checkout -q -b apk
          git add SpsMonitor.apk
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "APK aus ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
