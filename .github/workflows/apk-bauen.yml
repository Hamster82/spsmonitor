# Baut die APK bei GitHub – auf dem eigenen Rechner wird dafür weder
# Android Studio noch ein SDK gebraucht.
#
# Die fertige Datei liegt danach an drei Stellen:
#   1. als Release unter "Releases" (fester Link, siehe README)
#   2. im Branch "apk"
#   3. unter "Artifacts" beim jeweiligen Lauf

name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android-SDK-Lizenzen bestätigen
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: APK bauen (verkleinerte Release-Fassung)
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee bauprotokoll.txt

      # Bei einem Fehler das Protokoll im Zweig "protokoll" ablegen, damit es
      # ohne Umweg über die Actions-Oberfläche abrufbar ist.
      - name: Protokoll ablegen
        if: failure()
        run: |
          mkdir -p log-out && tail -c 200000 bauprotokoll.txt > log-out/bauprotokoll.txt
          cd log-out
          git init -q && git checkout -q -b protokoll
          git add bauprotokoll.txt
          git -c user.name="github-actions" -c user.email="actions@github.com" \
              commit -qm "Protokoll aus ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" protokoll

      - name: APK umbenennen
        run: |
          cp app/build/outputs/apk/release/app-release.apk SpsMonitor.apk
          ls -lh SpsMonitor.apk

      - name: APK zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v5
        with:
          name: SpsMonitor-APK
          path: SpsMonitor.apk

      - name: Release veröffentlichen (fester Download-Link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete aktuell --yes --cleanup-tag 2>/dev/null || true
          gh release create aktuell SpsMonitor.apk \
            --title "SPS Monitor – neueste Version" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}.

          Zum Installieren die Datei auf dem Handy antippen. Android fragt
          einmal nach der Erlaubnis für Apps aus dieser Quelle."

      - name: APK im Branch "apk" ablegen
        run: |
          mkdir apk-out && cp SpsMonitor.apk apk-out/
          cd apk-out
          git init -q && git checkout -q -b apk
          git add SpsMonitor.apk
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "APK aus ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
